<title>FIXTURE: Gmail-like reading pane (not Gmail)</title>
<!--
  TEST FIXTURE for extension/gmail.js. It is NOT Gmail. It imitates the reading-pane structure that open-source Gmail extensions rely on:
    div[role=main] > h2.hP (subject)                          milasterb/tells gmail-adapter.js, baongocdz/phishguard gmail.ts, MohisnNasim89/InboxGuardian gmail.js
    div.adn.ads[data-message-id][data-legacy-message-id]      message wrapper (same sources)
    h3.iw > span.gD[email][name] (+ span.go)                  sender chip (same sources)
    div.ii.gt > div.a3s.aiL                                   message body (same sources)
    Gmail keeps previously opened messages in the DOM, hidden (baongocdz/phishguard gmail.ts note), so switching hides, never removes.
  Email bodies: see SOURCES.md next to this file. Fictional or anonymised (phone numbers: area code kept, rest 555-01xx).
-->

body{margin:0;font:14px Roboto,Arial,sans-serif;color:#202124;background:#f6f8fc}
.wm{position:fixed;right:8px;bottom:8px;background:#b3261e;color:#fff;padding:4px 10px;font-weight:700;z-index:5;border-radius:4px}
.layout{display:flex;min-height:100vh}.nav{width:220px;padding:12px;background:#fff;border-right:1px solid #ddd}.nav a{display:block;padding:6px 8px;color:#202124;text-decoration:none;border-radius:4px}.nav a:hover{background:#e8eaed}
.nH{flex:1;padding:16px 24px;background:#fff;margin:8px;border-radius:12px}
.hP{font-size:22px;font-weight:400;margin:0 0 12px}
.adn{border-top:1px solid #e0e0e0;padding:8px 0}.gs{padding:0 0 0 0}.gE{margin-bottom:8px}.gD{font-weight:700}.go{color:#5f6368}
.a3s{font-size:14px;line-height:1.5}.a3s h1{font-size:22px}.a3s h3{margin:12px 0 4px}.a3s p{margin:4px 0}
</style></head><body>

var THREAD = ['plain','scam'];
var seq = 0;
function msgEl(id) {
  var m = M[id], n = ++seq;
  var w = document.createElement('div'); w.className = 'adn ads'; w.setAttribute('data-message-id', '#msg-f:fx' + id); w.setAttribute('data-legacy-message-id', 'fx' + id + n); w.setAttribute('data-fxid', id);
  w.innerHTML = '<div class="gs"><div class="gE iv gt"><table class="cf gJ"><tbody><tr class="acZ"><td class="gF gK"><table class="cf ix"><tbody><tr><td class="c2"><h3 class="iw"><span class="qu"><span class="gD" email="' + m.e + '" name="' + m.n + '">' + m.n + '</span> <span class="go">&lt;' + m.e + '&gt;</span></span></h3></td></tr></tbody></table></td></tr></tbody></table></div>' +
    '<div class="ii gt"><div id=":fx' + n + '" class="a3s aiL "><div dir="ltr">' + m.body + '</div></div></div></div>';
  return w;
}
var main = document.getElementById('main'), shown = {};
function ensureSubject(text) {
  var h = main.querySelector('h2.hP');
  if (!h) { var wrap = document.createElement('div'); wrap.className = 'ha'; wrap.innerHTML = '<h2 class="hP" tabindex="-1"></h2>'; main.insertBefore(wrap, main.firstChild); h = wrap.firstChild; }
  h.textContent = text; return h;
}
function openFromHash() {
  var id = (location.hash.match(/^#inbox\/(\w+)/) || [])[1];
  var all = main.querySelectorAll('.adn'); for (var i = 0; i < all.length; i++) all[i].style.display = 'none';
  var hp = main.querySelector('.ha'); if (hp) hp.style.display = id ? '' : 'none';
  document.getElementById('list').style.display = id ? 'none' : '';
  if (!id) return;
  var ids = id === 'thread' ? THREAD : [id];
  ensureSubject(id === 'thread' ? 'Re: Saturday plans' : M[id].s);
  ids.forEach(function (k) {
    var key = (id === 'thread' ? 'thread:' : '') + k;
    if (!shown[key]) { shown[key] = msgEl(k); main.appendChild(shown[key]); }
    shown[key].style.display = '';
  });
}
// Test hook: replace the opened message in place (same element, new content), the way a re-render could.
window.__replaceBody = function (toId) { var a = main.querySelector('.adn:not([style*="none"]) .a3s > div'); a.innerHTML = M[toId].body; var s = main.querySelector('.adn:not([style*="none"]) .gD'); s.setAttribute('email', M[toId].e); };
window.addEventListener('hashchange', openFromHash); openFromHash();
